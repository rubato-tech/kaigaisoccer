name: 試合データ自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # JST 6:00
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 14 * * *"   # JST 23:00
  workflow_dispatch:

jobs:
  refresh:
    name: 試合データを更新（リーグ別）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        league_id:
          - "4328"
          - "4335"
          - "4332"
          - "4331"
          - "4334"
          - "4329"
          - "4330"
          - "4337"
          - "4338"
          - "4344"
          - "4339"
          - "4482"
          - "4570"
          - "4483"
          - "4506"
          - "4485"
          - "4484"
          - "4510"
          - "4480"
          - "4481"
          - "5071"
          - "4429"
          - "4502"
          - "4490"
          - "4395"

    steps:
      - name: リーグ ${{ matrix.league_id }} のデータを更新
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -X POST \
            "${{ secrets.SITE_URL }}/api/scheduled/refresh-league?id=${{ matrix.league_id }}" \
            -H "Cookie: app_session_id=${{ secrets.SCHEDULED_TASK_COOKIE }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -w "%{http_code}" )
          BODY=$(cat /tmp/response.json 2>/dev/null || echo "(no body)")
          echo "HTTP: $HTTP_STATUS / $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then exit 1; fi
