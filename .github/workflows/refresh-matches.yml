name: 試合データ自動更新（直接DB書き込み）

on:
  schedule:
    - cron: "0 21 * * *"   # JST 6:00
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 15 * * *"   # JST 0:00 (翌日)
  workflow_dispatch:

jobs:
  sync:
    name: 試合データを直接DBに更新
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: DBマイグレーション（world_cup追加）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --import tsx/esm -e "
          import { drizzle } from 'drizzle-orm/mysql2';
          import mysql from 'mysql2/promise';
          const url = new URL(process.env.DATABASE_URL);
          const conn = await mysql.createConnection({
            host: url.hostname,
            port: Number(url.port),
            user: url.username,
            password: url.password,
            database: url.pathname.slice(1),
            ssl: { rejectUnauthorized: false }
          });
          await conn.execute(\"ALTER TABLE \`matches\` MODIFY COLUMN \`category\` enum('euro_league','cup','uefa','national_team','world_cup') NOT NULL\");
          console.log('Migration done');
          await conn.end();
          "

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 全リーグのデータを直接DBに同期
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx/esm scripts/sync-direct.ts
