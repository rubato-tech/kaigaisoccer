name: 試合データ自動更新（直接DB書き込み）

on:
  schedule:
    - cron: "0 21 * * *"   # JST 6:00
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 15 * * *"   # JST 0:00 (翌日)
  workflow_dispatch:

jobs:
  sync:
    name: 試合データを直接DBに更新
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 全リーグのデータを直接DBに同期
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx/esm scripts/sync-direct.ts
